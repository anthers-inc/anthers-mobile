# The APK release workflow, separate from `ci.yml` for the same reason the desktop's is: a
# packaging failure must not queue behind, or block, a code check. Cutting a release happens
# on an explicit `v<calver>` tag; a `workflow_dispatch` run builds the same APK and attaches
# it as a workflow artifact without touching any release, which is how the pipeline gets
# proven before its first tag.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # The NDK version is pinned to the one `src-tauri/gen/android` was generated
      # against; a different one changes the linker and the APK it produces.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android SDK packages and the NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT" -path '*/cmdline-tools/*/bin/sdkmanager' -type f | sort | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "NDK_HOME=$SDK_ROOT/ndk/27.0.12077973"
            echo "PATH=$SDK_ROOT/platform-tools:$(dirname "$SDKMANAGER"):$PATH"
          } >> "$GITHUB_ENV"

      # A release ships every ABI: the APK that reaches a phone must install on the phone it
      # happens to be, not on the one the developer happened to build for.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # 🚨 The key's durable home is Bitwarden Secrets; these repository secrets are the
      # working copy the build reads, and `bundle.licenseFile`'s sibling rule applies — the
      # file exists only for the length of the run.
      #
      # 🚨 **Every value reaches the shell through `env:`, never as `${{ }}` inside the
      # script.** An expression is substituted before bash parses the line, so a password
      # carrying a quote, a `$(…)` or a newline would run as shell syntax; as an environment
      # variable the same characters are inert. It also keeps the value out of the rendered
      # script, which is what a `set -x` trace prints.
      #
      # `umask 077` is what stops a window where the two files are readable by every user on
      # the runner — the keystore is the app's update identity, so a copy of it is a copy of
      # every future release.
      - name: Configure signing
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          umask 077
          cd src-tauri/gen/android
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' \
            "$KEY_ALIAS" \
            "$KEY_PASSWORD" \
            "$RUNNER_TEMP/keystore.jks" > keystore.properties
          base64 -d > "$RUNNER_TEMP/keystore.jks" <<< "$KEY_BASE64"
          chmod 600 keystore.properties "$RUNNER_TEMP/keystore.jks"

      # The release's name reads the version the three fields carry rather than the tag's
      # text, so a tag and a version that disagree cannot name the release one number and
      # the APK another. `make version` is the same check, run here where it can fail a build.
      - name: Read the version
        id: version
        run: |
          version="$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Build the APK
        run: bunx tauri android build --apk

      # An unsigned APK cannot be installed over itself and cannot be updated; publishing one
      # would be worse than publishing nothing. This fails the run rather than trusting that
      # the signing config was applied.
      - name: Refuse an unsigned APK
        run: |
          apk="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" >/dev/null \
            || { echo "The release APK is not signed — keystore.properties did not reach Gradle."; exit 1; }
          echo "Signed: $apk"

      # 🚨 **The asset's public name.** Gradle calls its output `app-universal-release.apk`,
      # which names a build directory rather than the app and is identical in every release,
      # so two downloads in one folder are indistinguishable. The desktop's artifacts read
      # `Anthers_<version>_<arch>.deb`; this is that shape on the phone's single universal
      # APK, and it is the reason the version is read above.
      - name: Name the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk \
            "Anthers_${VERSION}.apk"

      # The name and the tag have to agree, because one of them becomes the release's title
      # and the other becomes the file inside it. `--check` runs on the pull request, so this
      # only fires if a tag was cut from a commit that never passed through it.
      - name: Check the tag names this version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "v${VERSION}" = "$GITHUB_REF_NAME" || {
            echo "The tag $GITHUB_REF_NAME does not name the version ${VERSION}."
            echo "Cut the tag from the commit that carries that version."
            exit 1
          }

      # A real tag push creates the draft; a dispatch run (`github.ref_name` would otherwise
      # read `main`, and the desktop's first proof run created a draft release *named main*)
      # leaves it as a workflow artifact instead, so the pipeline can be proven without
      # publishing anything.
      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --draft \
            --title "Anthers Mobile ${tag#v}" \
            --generate-notes \
            "Anthers_${VERSION}.apk"

      - name: Attach the APK as a run artifact (dispatch runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: anthers-mobile-release-apk
          path: "Anthers_${{ steps.version.outputs.version }}.apk"
          if-no-files-found: error
