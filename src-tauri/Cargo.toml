[package]
name = "anthers-mobile"
version = "2026.10.0"
edition = "2021"
description = "Anthers — the mobile app for the Anthers platform"
authors = ["Anthers, Inc."]
license = "Apache-2.0"

[lib]
# 🚨 Tauri's mobile targets link this crate as a library, and the three crate types are
# all required: staticlib for iOS, cdylib for Android, rlib so the desktop binary beside
# it (`src/main.rs`) can call `run()`. A mobile target refuses a binary-only crate.
name = "anthers_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.0.0", features = [] }

[dependencies]
tauri = { version = "^2.0.0", features = [] }
# Only to quote the API origin correctly into the injected script.
serde_json = "1.0"
# Delivers `https://anthers.org/...` into the app once Android has verified the domain
# against the association file the platform serves. Mobile registers deep links through
# `tauri.conf.json` only — runtime registration is desktop-only.
tauri-plugin-deep-link = "^2.0.0"
# Opens the authorize page in the system browser. The sign-in never happens in this
# webview: a password typed here would be a second host asking for a credential it is not
# the authority on.
tauri-plugin-opener = "^2.0.0"
# The two pre-auth calls, posted from Rust so they never depend on the webview's CORS.
tauri-plugin-http = "^2.0.0"
# PKCE: a random verifier and the SHA-256 challenge derived from it.
getrandom = "0.2"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
